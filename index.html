<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Max Erb, QB #18, Bethel Wildcats: how he has already beaten the odds, and what comes next.">
<title>Max Erb: Beat the Odds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F3FA; --surface:#FFFFFF; --ink:#1D1530; --muted:#5E5572; --faint:#D9D2E6;
  --band:#3C2465; --brand:#5A3392; --gold:#B8830F; --gold-hi:#E8B23A; --good:#2E7D5B;
  --on-band:#F4EEFF; --on-band-muted:#C9B9E6; --dot:#D6CEE3; --line:#E4DDEE;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#130D1D; --surface:#1D1530; --ink:#F1ECF8; --muted:#ADA3C2; --faint:#3A2F52;
    --band:#2A1947; --brand:#9A76D6; --gold:#E8B23A; --gold-hi:#F2C55C; --good:#5FBF93;
    --on-band:#F4EEFF; --on-band-muted:#BBA9DD; --dot:#34294A; --line:#2E2442;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#130D1D; --surface:#1D1530; --ink:#F1ECF8; --muted:#ADA3C2; --faint:#3A2F52;
  --band:#2A1947; --brand:#9A76D6; --gold:#E8B23A; --gold-hi:#F2C55C; --good:#5FBF93;
  --on-band:#F4EEFF; --on-band-muted:#BBA9DD; --dot:#34294A; --line:#2E2442;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* HERO */
.hero{background:var(--band);color:var(--on-band);position:relative;overflow:hidden}
.hero::after{ /* yard-line hash marks */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
  background:repeating-linear-gradient(90deg,var(--on-band) 0 2px,transparent 2px 64px);
  -webkit-mask:linear-gradient(180deg,#000 0 14px,transparent 14px calc(100% - 14px),#000 calc(100% - 14px));
          mask:linear-gradient(180deg,#000 0 14px,transparent 14px calc(100% - 14px),#000 calc(100% - 14px));
}
.hero .wrap{padding-block:44px 48px;position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero .eyebrow{color:var(--on-band-muted)}
.hero h1{font-size:clamp(46px,9vw,84px);font-weight:800;text-transform:uppercase;letter-spacing:.005em;margin-top:14px}
.hero h1 span{color:var(--gold-hi)}
.hero .lede{margin-top:16px;max-width:52ch;color:var(--on-band-muted);font-size:17px}
.jersey{font-family:var(--display);font-weight:800;font-size:clamp(96px,18vw,168px);line-height:.8;color:transparent;-webkit-text-stroke:2px var(--gold-hi);letter-spacing:-.02em}

section{padding-block:48px}
section + section{border-top:1px solid var(--line)}
.sec-head{display:grid;gap:10px;margin-bottom:26px}
.sec-head .eyebrow{color:var(--brand)}
.sec-head h2{font-size:clamp(32px,5.5vw,46px);font-weight:700;text-transform:uppercase}
.sec-head p{color:var(--muted);max-width:60ch}

/* DOT FIELD */
.field{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;align-items:start}
.field svg{width:100%;height:auto;display:block}
.legend{display:grid;gap:16px}
.leg{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:start}
.sw{width:14px;height:14px;border-radius:50%;margin-top:5px}
.leg b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;display:block;font-variant-numeric:tabular-nums}
.leg span{color:var(--muted);font-size:14px}
.leg.max b{color:var(--gold)}
#maxdot{transform-origin:center;transform-box:fill-box}
@media (prefers-reduced-motion: no-preference){
  #maxring{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(1.6)}}
}

/* LADDER */
.ladder{display:grid;gap:0;position:relative}
.rung{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.rung:last-child{border-bottom:0}
.mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--faint);color:var(--muted);font-family:var(--mono);font-size:13px}
.rung.done .mark{background:var(--gold);border-color:var(--gold);color:#fff}
.rung.next .mark{border-color:var(--brand);color:var(--brand);border-style:dashed}
.rung h3{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.rung p{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:52ch}
.odds{text-align:right;font-family:var(--display);line-height:1}
.odds b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.odds small{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rung.done .odds b{color:var(--gold)}
.rung.next .odds b{color:var(--brand)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:6px}
.rung.done .tag{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.rung.next .tag{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.rung.later .tag{background:var(--line);color:var(--muted)}
.callout{margin-top:26px;padding:18px 20px;background:var(--surface);border-left:3px solid var(--gold);font-size:15.5px}
.callout b{font-weight:600}

/* CONTROLLABLES */
.ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);padding:22px 20px 20px;border-top:4px solid var(--brand);display:grid;gap:12px;align-content:start}
.card h3{font-size:34px;font-weight:800;text-transform:uppercase;color:var(--brand)}
.card .sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.card li{position:relative;padding-left:18px;font-size:14.5px}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--gold)}
.notctrl{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.notctrl .eyebrow{color:var(--muted);margin-right:6px}
.chip{font-size:13.5px;color:var(--muted);padding:5px 11px;border:1px solid var(--faint);border-radius:999px;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}

/* CLOSE */
.close{background:var(--band);color:var(--on-band)}
.close .wrap{padding-block:52px;display:grid;gap:16px}
.close h2{font-size:clamp(34px,6.5vw,58px);font-weight:800;text-transform:uppercase}
.close h2 span{color:var(--gold-hi)}
.close p{color:var(--on-band-muted);max-width:58ch;font-size:16.5px}
.sign{font-family:var(--display);font-size:24px;font-weight:600;color:var(--on-band)!important;margin-top:6px}
.fine{font-size:12.5px;color:var(--muted);padding-block:20px 28px}

@media (max-width:720px){
  .hero .wrap{grid-template-columns:1fr}
  .jersey{display:none}
  .field{grid-template-columns:1fr}
  .legend{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .leg{grid-template-columns:1fr;gap:6px}
  .leg b{font-size:26px}
  .ctrl{grid-template-columns:1fr}
  .rung{grid-template-columns:44px 1fr;gap:14px}
  .mark{width:34px;height:34px}
  .odds{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}
  .odds b{display:inline;font-size:28px}
}

/* FUNNEL */
.funnel{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:180px minmax(0,1fr);column-gap:24px;row-gap:12px;padding:22px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.num{display:grid;gap:4px;align-content:start}
.num b{font-family:var(--display);font-size:46px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;color:var(--ink)}
.num span{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1.1}
.step.max .num span{color:var(--gold)}
.step.next .num span{color:var(--brand)}
.what h3{font-size:25px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.what h3 svg{color:var(--gold);display:inline-block;vertical-align:-1px;margin-right:6px}
.what p{color:var(--muted);font-size:15px;margin-top:5px;max-width:58ch}
.what strong{color:var(--ink)}
.track{grid-column:2;height:22px;background:var(--line);border-radius:3px;position:relative;display:flex;align-items:center}
.track i{display:block;height:100%;border-radius:3px;min-width:4px;background:var(--dot)}
.step.all .track i{background:var(--muted);opacity:.45}
.step.done .track i{background:var(--brand)}
.step.max .track i{background:var(--gold)}
.step.next .track i{background:transparent;border:2px dashed var(--brand);min-width:8px}
.track em{font-style:normal;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-left:12px}
.step.max{background:color-mix(in srgb,var(--gold) 9%,transparent);margin-inline:-14px;padding-inline:14px;border-radius:4px;border-bottom-color:transparent}
.step.max .num b{color:var(--gold)}
.step.next .num b{color:var(--brand)}
.step.next h3{color:var(--brand)}
@media (max-width:720px){
  .step{grid-template-columns:1fr;row-gap:8px}
  .num{grid-auto-flow:column;justify-content:start;align-items:baseline;gap:12px}
  .num b{font-size:40px}
  .track{grid-column:1}
  .what h3{font-size:22px}
}

.track em.purple{color:var(--brand)}
.beyond{margin-top:22px;display:grid;gap:6px;padding-left:16px;border-left:2px dashed var(--faint)}
.beyond .eyebrow{color:var(--brand)}
.beyond p:last-child{color:var(--muted);max-width:60ch}
.mantra{margin-top:28px;font-family:var(--display);font-size:clamp(26px,4.4vw,36px);font-weight:700;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.mantra span{color:var(--gold)}
.letter{display:grid;gap:14px;max-width:64ch;margin-top:8px}
.close .letter p{color:var(--on-band-muted);font-size:16.5px;max-width:none}
.close .letter p.pull{font-family:var(--display);font-size:clamp(22px,3.6vw,28px);font-weight:700;text-transform:uppercase;line-height:1.1;color:var(--gold-hi);margin-block:4px}
.close .letter em{color:var(--on-band);font-style:italic}

.hero .wrap{align-items:center}
.photo{margin:0;width:clamp(220px,30vw,300px);aspect-ratio:423/531;max-width:100%;border:3px solid var(--gold-hi);border-radius:4px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);transform:rotate(1.5deg)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:720px){
  .photo{width:min(78%,300px);transform:none;order:-1;justify-self:center}
  .num span{font-size:20px}
}
</style>
<style>
body.locked{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--band)}
.gate{width:min(100%,460px);padding:28px 16px 36px;display:grid;gap:14px;color:var(--on-band);text-align:center;justify-items:center}
.gate .g-eye{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-band-muted)}
.gate h1{font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin-top:-6px}
.path{width:100%;display:grid;gap:12px;margin-top:2px}
.g-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);text-align:left}
.road{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative;align-items:start}
.road::before{content:"";position:absolute;left:12%;right:12%;top:calc(50% - 26px);height:2px;background:color-mix(in srgb,var(--gold-hi) 45%,transparent);z-index:0}
.road li{display:grid;gap:2px;justify-items:center;align-content:start;position:relative;z-index:1;min-width:0}
.road img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid color-mix(in srgb,var(--on-band) 25%,transparent);margin-bottom:6px;filter:saturate(.9)}
.road b{font-family:var(--display);font-size:19px;font-weight:700;color:var(--gold-hi);line-height:1}
.road span{font-size:11.5px;font-weight:600;line-height:1.2;color:var(--on-band)}
.road small{font-family:var(--mono);font-size:10px;color:var(--on-band-muted)}
.now{display:grid;grid-template-columns:42% 1fr;gap:16px;align-items:center;text-align:left;background:rgba(255,255,255,.06);border:2px solid var(--gold-hi);border-radius:12px;padding:10px;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.now img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.now-txt{display:grid;gap:4px}
.now-txt .now-tag{justify-self:start;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--gold-hi);color:#231538;padding:3px 8px;border-radius:3px;font-weight:500}
.now-txt strong{font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;line-height:1;margin-top:6px}
.now-txt span{font-size:14px;color:var(--on-band-muted)}
.now-txt .now-num{font-family:var(--display);font-size:22px;font-weight:700;color:var(--gold-hi)}
.gate form{width:100%;margin-top:6px}
@media (max-width:380px){ .gate h1{font-size:38px} .road{gap:7px} .road span{font-size:10.5px} .now-txt strong{font-size:24px} }
.gate form{display:grid;gap:10px}
.gate input{font:inherit;font-size:17px;padding:12px 14px;border-radius:4px;border:2px solid var(--on-band-muted);background:rgba(255,255,255,.08);color:var(--on-band);text-align:center}
.gate input:focus{outline:none;border-color:var(--gold-hi)}
.gate button{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:11px;border:0;border-radius:4px;background:var(--gold-hi);color:#231538;cursor:pointer}
.gate button:focus-visible{outline:3px solid var(--on-band);outline-offset:2px}
.gate .err{color:#FFB4A8;font-size:14px;min-height:1.2em}
</style>
</head>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function unlock(p){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},k,b64(CT));
  return new TextDecoder().decode(pt);
}
async function open(p,quiet){
  try{
    var html=await unlock(p);
    document.getElementById('gate').remove();
    document.body.classList.remove('locked');
    document.getElementById('app').innerHTML=html;
    try{sessionStorage.setItem('mxpw',p)}catch(e){}
    window.scrollTo(0,0);
  }catch(e){ if(!quiet){document.getElementById('err').textContent='That password didn\'t work. Try again.';document.getElementById('pw').select();} }
}
document.getElementById('gf').addEventListener('submit',function(e){e.preventDefault();document.getElementById('err').textContent='';open(document.getElementById('pw').value.trim(),false)});
try{var saved=sessionStorage.getItem('mxpw'); if(saved) open(saved,true);}catch(e){}
</script>
